# One Argo CD Application per folder under clusters/.
# Add a folder (clusters/<name>/) and push => Argo CD creates the app and the VKS cluster.
# Apply once:  kubectl apply -n <argocd-namespace> -f argocd/vks-clusters-appset.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vks-clusters
  namespace: <argocd-namespace>           # where Argo CD is installed
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/pratjainvmw/vcf-demo-infra.git
        revision: HEAD
        directories:
          - path: clusters/*
  template:
    metadata:
      name: '{{.path.basename}}'          # e.g. vks-argo, vks-drax, vks-groot
    spec:
      project: default
      source:
        repoURL: https://github.com/pratjainvmw/vcf-demo-infra.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://172.16.24.6:6443  # Supervisor, as registered in Argo CD (argocd cluster list)
        # No namespace here: each clusters/<name>/kustomization.yaml sets its own vSphere Namespace.
      syncPolicy:
        automated:
          prune: false
          selfHeal: false
  # Keep generated apps (and their VKS clusters) if a folder is removed or the ApplicationSet is deleted.
  syncPolicy:
    preserveResourcesOnDeletion: true
