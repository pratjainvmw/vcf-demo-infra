apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gamora
resources:
  - ../../base
namePrefix: vks-argo-
patches:
  - target:
      kind: AddonInstall
    patch: |-
      - op: replace
        path: /spec/clusters/0/selector/matchLabels/cluster.x-k8s.io~1cluster-name
        value: vks-argo
  # Headlamp UI hostname for the vks-argo cluster — change to a name you can publish in DNS.
  - target:
      kind: AddonConfig
      name: headlamp
    patch: |-
      - op: replace
        path: /spec/values/hostname
        value: headlamp-gamora.lab.worker-node.com
